name: Django CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


permissions:
  contents: read


env:
  # Force JavaScript-based GitHub Actions to use Node.js 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true


jobs:
  checks:
    name: Quality and Test Checks

    runs-on: ubuntu-latest

    env:
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}

    steps:
      # ==========================================================
      # Checkout
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v6


      # ==========================================================
      # Python
      # ==========================================================

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      # ==========================================================
      # uv
      # ==========================================================

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true


      # ==========================================================
      # Install dependencies
      # ==========================================================

      - name: Install dependencies
        run: uv sync --all-groups


      # ==========================================================
      # Django checks
      # ==========================================================

      - name: Django system checks
        working-directory: demo
        run: uv run python manage.py check


      # ==========================================================
      # Migration checks
      # ==========================================================

      - name: Check for missing migrations
        working-directory: demo
        run: uv run python manage.py makemigrations --check --dry-run


      # ==========================================================
      # Ruff lint
      # ==========================================================

      - name: Ruff lint checks
        run: uv run ruff check .


      # ==========================================================
      # Ruff formatting
      # ==========================================================

      - name: Ruff formatting checks
        run: uv run ruff format --check .


      # ==========================================================
      # Bandit
      # ==========================================================

      - name: Bandit security scan
        working-directory: demo
        run: |
          uv run bandit \
            -r api my1stapp \
            --exclude "api/tests,my1stapp/tests"


      # ==========================================================
      # pip-audit
      # ==========================================================

      - name: pip-audit dependency scan
        run: uv run pip-audit


      # ==========================================================
      # OpenAPI schema validation
      # ==========================================================

      - name: Generate and validate OpenAPI schema
        working-directory: demo
        run: |
          uv run python manage.py spectacular \
            --file /tmp/schema.yml \
            --validate


      # ==========================================================
      # Check committed schema is current
      # ==========================================================

      - name: Check OpenAPI schema is current
        working-directory: demo
        run: diff -q schema.yml /tmp/schema.yml


      # ==========================================================
      # Tests with branch coverage
      # ==========================================================

      - name: Run tests with branch coverage
        working-directory: demo
        run: |
          uv run coverage run \
            --branch \
            --source=api,my1stapp \
            manage.py test


      # ==========================================================
      # Coverage report
      # ==========================================================

      - name: Display coverage report
        working-directory: demo
        run: uv run coverage report -m --fail-under=55