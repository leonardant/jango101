[project]
name = "jango101"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.1",
    "django-unfold>=0.104.1",
    "djangorestframework>=3.18.0",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "coverage>=7.16.0",
    "pip-audit>=2.10.1",
    "ruff>=0.16.6",
]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["RUF012"]
