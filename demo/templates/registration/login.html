<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>

<body>

    <h1>Login</h1>

    {% if form.errors %}
        <p>
            Your username or password was incorrect.
        </p>
    {% endif %}

    {% if next %}
        <p>
            Please log in to access this page.
        </p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Login
        </button>

        <input type="hidden" name="next" value="{{ next }}">
    </form>

</body>
</html>
